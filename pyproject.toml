[project]
name = "info-hr"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migration", "docs", "_starter_kit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/**/migrations/*" = ["E501"]
"app/**/tests.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = "app"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "unfold.*", "docxtpl.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app"]
testpaths = ["app"]
python_files = ["tests.py", "test_*.py", "tests_*.py"]
