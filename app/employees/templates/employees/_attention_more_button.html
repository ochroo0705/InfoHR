<button type="button" data-more-button hx-get="{% url 'employees:attention_more' %}?kind={{ g.kind|urlencode }}&urgency={{ g.urgency }}" hx-target="{% if g.dated %}closest li{% else %}this{% endif %}" hx-swap="outerHTML" class="rounded-full border border-slate-300 bg-surface px-2.5 py-0.5 text-xs font-medium text-slate-600 hover:border-violet-300 hover:text-violet-700" title="Бусдыг харуулах">+{{ g.more }}</button>
