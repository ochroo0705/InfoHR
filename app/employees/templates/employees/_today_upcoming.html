{% for u in upcoming %}
<div class="relative -mx-2 flex items-baseline justify-between gap-3 rounded-lg border-b border-slate-100 px-2 py-1.5 text-sm transition-colors hover:bg-violet-50 focus-within:bg-violet-50 last:border-0">
  <span>{% if u.kind == "birthday" %}Төрсөн өдөр{% else %}{{ u.years }} жилийн ой{% endif %} · <a href="{% url 'employees:detail' u.row.employee.pk %}" class="text-violet-700 after:absolute after:inset-0 after:content-[''] focus-visible:outline-none">{{ u.row.employee.full_name }}</a></span>
  <span class="text-slate-500">{{ u.on|date:"Y-m-d" }}</span>
</div>
{% empty %}<p class="text-sm text-slate-400">Ойрын 30 хоногт {% if kind == "birthday" %}төрсөн өдөр{% else %}ажилд орсны ой{% endif %} алга.</p>{% endfor %}
