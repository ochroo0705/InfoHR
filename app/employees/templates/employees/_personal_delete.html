<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" onclick="if(event.target===this)this.remove()">
  <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">
    <h2 class="mb-4 text-lg font-semibold">{{ title }}</h2>
    <p class="text-sm text-slate-700">Энэ бичлэгийг устгах уу? Устгасны дараа буцаах боломжгүй.</p>
    <form hx-post="{{ action }}" hx-target="closest div.fixed" hx-swap="outerHTML" class="mt-4 space-y-3">
      {% csrf_token %}
      {% for field in form.hidden_fields %}{{ field }}{% endfor %}
      {% if error %}<p class="rounded bg-red-50 p-2 text-sm text-red-700">{{ error }}</p>{% endif %}
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="this.closest('div.fixed').remove()" class="rounded-lg border border-slate-300 px-4 py-2 text-sm">Болих</button>
        <button class="rounded-lg bg-red-600 px-4 py-2 text-sm text-white hover:bg-red-700">Устгах</button>
      </div>
    </form>
  </div>
</div>
