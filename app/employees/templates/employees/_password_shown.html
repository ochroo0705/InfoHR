<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">
    <h2 class="mb-4 text-lg font-semibold">Түр нууц үг</h2>
    <p class="text-sm text-slate-600">Нэвтрэх нэр</p>
    <p class="mb-3 font-mono text-base">{{ username }}</p>
    <p class="text-sm text-slate-600">Түр нууц үг</p>
    <p class="mb-3 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 font-mono text-lg tracking-wider select-all">{{ password }}</p>
    <p class="text-sm text-red-700">Энэ нууц үгийг зөвхөн одоо нэг удаа харуулна. Ажилтанд өгөөд хадгалахгүй байгаарай.</p>
    <p class="mt-2 text-xs text-slate-500">Ажилтан анх нэвтрэхдээ нууц үгээ өөрөө солино.</p>
    <div class="flex justify-end pt-4">
      <button type="button" onclick="location.reload()" class="rounded-lg bg-violet-600 px-4 py-2 text-sm text-white hover:bg-violet-700">Хаах</button>
    </div>
  </div>
</div>
