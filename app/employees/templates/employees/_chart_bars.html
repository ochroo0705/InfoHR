{% if no_data %}
<p class="text-xs text-slate-400">{{ no_data_text }}</p>
{% else %}
<ul class="m-0 list-none space-y-1.5 p-0" role="img" aria-label="{{ summary }}" data-bar-chart>
  {% for b in bars %}
  <li class="grid grid-cols-[minmax(0,8rem)_1fr_2rem] items-center gap-2 text-xs text-slate-500">
    <span class="truncate" title="{{ b.label }}">{{ b.label }}</span>
    <span class="h-2 rounded bg-slate-100"><span class="block h-2 rounded bg-violet-500" style="width: {{ b.pct }}%"></span></span>
    <span class="text-right tabular-nums">{{ b.value }}</span>
  </li>
  {% endfor %}
</ul>
{% endif %}
