{# One repeating row (education or family). Used in the page for each saved row and in the <template> the script clones. #}
<div class="grid gap-4 rounded-lg border border-slate-200 bg-white p-4" data-row data-row-label="{{ label }}" data-index="{{ row.index }}">
  <div class="flex items-center justify-between gap-3">
    <p class="text-base font-semibold" data-row-title>{{ label }} {{ number }}</p>
    <button type="button" hidden data-row-remove class="min-h-11 rounded-lg px-3 text-base text-red-600 hover:bg-red-50">Устгах</button>
  </div>
  {% for f in row.fields %}{% include "employees/selfform/_field.html" with f=f %}{% endfor %}
</div>
