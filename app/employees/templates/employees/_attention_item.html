<li class="group/item flex items-baseline gap-2"><span><a href="{% url 'employees:detail' a.employee.pk %}" class="font-medium underline">{{ a.employee.full_name }}</a> — <span{% if a.urgency == 0 %} class="font-medium text-red-700"{% endif %}>{{ a.text }}</span></span>
  <button type="button" hx-post="{% url 'employees:attention' %}" hx-vals='{"key": "{{ a.key|escapejs }}", "action": "{{ action }}"}' hx-target="#attention" hx-swap="outerHTML" class="ml-auto shrink-0 text-xs text-amber-700 hover:underline{% if action == 'dismiss' %} opacity-60 group-hover/item:opacity-100{% endif %}" title="{% if action == 'dismiss' %}Надад дахин харуулахгүй — өөрчлөгдвөл дахин гарна{% else %}Дахин жагсаалтад гаргах{% endif %}">{% if action == "dismiss" %}Мэдлээ{% else %}Дахин харуулах{% endif %}</button></li>
