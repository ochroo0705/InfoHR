<li class="group/item flex items-baseline gap-2"><span><a href="{% url 'employees:detail' a.employee.pk %}" class="font-medium text-slate-800 hover:text-violet-700 hover:underline">{{ a.employee.full_name }}</a> <span class="text-slate-400">—</span> <span{% if a.urgency == 0 %} class="text-red-700"{% endif %}>{{ a.text }}</span></span>
  <button type="button" hx-post="{% url 'employees:attention' %}" hx-vals='{"key": "{{ a.key|escapejs }}", "action": "{{ action }}"}' hx-target="#attention" hx-swap="outerHTML" class="ml-auto shrink-0 rounded px-2 py-0.5 text-xs text-slate-500 hover:bg-slate-100 hover:text-slate-700{% if action == 'dismiss' %} opacity-0 group-hover/item:opacity-100 focus:opacity-100{% endif %}" title="{% if action == 'dismiss' %}Надад дахин харуулахгүй — өөрчлөгдвөл дахин гарна{% else %}Дахин жагсаалтад гаргах{% endif %}">{% if action == "dismiss" %}Мэдлээ{% else %}Дахин харуулах{% endif %}</button></li>
