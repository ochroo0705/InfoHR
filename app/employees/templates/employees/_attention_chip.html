<span {% if folded > 0 %}data-folded class="hidden group/chip items-center rounded-full border border-slate-200 bg-white text-xs"{% else %}class="group/chip inline-flex items-center rounded-full border border-slate-200 bg-white text-xs"{% endif %}>
  <a href="{% url 'employees:detail' a.employee.pk %}" class="rounded-l-full py-0.5 pl-2.5 pr-1 font-medium text-slate-700 hover:text-violet-700" title="{{ a.employee.full_name }}">{{ a.employee.short_name }}</a>
  <button type="button" hx-post="{% url 'employees:attention' %}" hx-vals='{"key": "{{ a.key|escapejs }}", "action": "dismiss"}' hx-target="#attention" hx-swap="outerHTML" class="rounded-r-full py-0.5 pl-0.5 pr-2 text-slate-300 hover:text-slate-600" title="Мэдлээ — надад дахин харуулахгүй" aria-label="Мэдлээ: {{ a.employee.full_name }}">×</button>
</span>
