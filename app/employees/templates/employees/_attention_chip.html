<span data-chip class="group/chip inline-flex items-center rounded-full border border-slate-200 bg-surface text-xs">
  {% if a.employee %}<a href="{% url 'employees:detail' a.employee.pk %}{{ a.anchor }}" class="rounded-l-full py-0.5 pl-2.5 pr-1 font-medium text-slate-700 hover:text-violet-700" title="{{ a.employee.full_name }}">{% if a.employee.pk in clashes %}{{ a.employee.short_name }} · {{ a.employee.code }}{% else %}{{ a.employee.short_name }}{% endif %}</a>{% else %}<a href="{{ a.url }}" class="rounded-l-full py-0.5 pl-2.5 pr-1 font-medium text-slate-700 hover:text-violet-700">Жагсаалт</a>{% endif %}
  {% if a.employee %}<button type="button" hx-post="{% url 'employees:attention' %}" hx-vals='{"key": "{{ a.key|escapejs }}", "action": "dismiss"}' hx-target="#attention" hx-swap="outerHTML" class="rounded-r-full px-2 py-1 text-slate-500 hover:text-slate-600" title="Мэдлээ — надад дахин харуулахгүй" aria-label="Мэдлээ: {% if a.employee %}{{ a.employee.full_name }}{% else %}Жагсаалт{% endif %}">×</button>{% endif %}
</span>
