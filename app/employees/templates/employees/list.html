{% extends "base.html" %}
{% block title %}Ажилтнууд{% endblock %}
{% block content %}
<div class="flex items-center gap-3 mb-4">
  <h1 class="text-xl font-semibold">Ажилтнууд</h1>
  {% if can_manage %}<a href="{% url 'employees:add' %}" class="ml-auto rounded-lg bg-violet-600 px-4 py-2 text-sm text-white hover:bg-violet-700">+ Ажилтан нэмэх</a>{% endif %}
</div>
{% include "employees/_attention.html" %}
<form class="flex flex-wrap items-center gap-2 mb-4" hx-get="{% url 'employees:list' %}" hx-target="#results" hx-push-url="true" hx-trigger="input changed delay:300ms from:input, change from:select, change from:input[name=group], viewchange">
  <input type="hidden" name="view" value="{{ view }}">
  <input name="q" value="{{ q }}" placeholder="Нэр, код, регистр, утсаар хайх" class="flex-1 min-w-60 rounded-lg border border-slate-300 px-3 py-2 text-sm">
  <select name="department" class="rounded-lg border border-slate-300 px-3 py-2 text-sm"><option value="">Бүх хэлтэс</option>
    {% for d in departments %}<option value="{{ d.pk }}"{% if department == d.pk|stringformat:"s" %} selected{% endif %}>{{ d.name }}</option>{% endfor %}</select>
  <select name="state" class="rounded-lg border border-slate-300 px-3 py-2 text-sm"><option value="">Одоо ажиллаж буй</option>
    {% for key, label in states.items %}<option value="{{ key }}"{% if state == key %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>
  <select name="type" class="rounded-lg border border-slate-300 px-3 py-2 text-sm"><option value="">Бүх төрөл</option>
    {% for key, label in types %}<option value="{{ key }}"{% if emp_type == key %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>
  <label class="inline-flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" name="group" value="1"{% if group %} checked{% endif %} class="rounded border-slate-300">Хэлтсээр бүлэглэх</label>
  <a href="?clear=1" class="text-sm text-slate-500 hover:text-violet-700">Цэвэрлэх</a>
  <div class="ml-auto inline-flex overflow-hidden rounded-lg border border-slate-300 text-sm">
    <button type="button" aria-pressed="{% if view == 'table' %}true{% else %}false{% endif %}" class="px-3 py-2 {% if view == 'table' %}bg-violet-600 text-white{% else %}bg-white text-slate-700 hover:bg-slate-50{% endif %}" data-view-btn="table" onclick="hrSetView(this.form, 'table'); htmx.trigger(this.form, 'viewchange')">Хүснэгт</button>
    <button type="button" aria-pressed="{% if view == 'grid' %}true{% else %}false{% endif %}" class="px-3 py-2 {% if view == 'grid' %}bg-violet-600 text-white{% else %}bg-white text-slate-700 hover:bg-slate-50{% endif %}" data-view-btn="grid" onclick="hrSetView(this.form, 'grid'); htmx.trigger(this.form, 'viewchange')">Зураг</button>
  </div>
</form>
<div id="results">{% include "employees/_results.html" %}</div>
<script>
function hrSetView(form, v) {
  form.elements.view.value = v;
  form.querySelectorAll("[data-view-btn]").forEach(function (b) {
    var on = b.getAttribute("data-view-btn") === v;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.classList.toggle("bg-violet-600", on);
    b.classList.toggle("text-white", on);
    b.classList.toggle("bg-white", !on);
    b.classList.toggle("text-slate-700", !on);
    b.classList.toggle("hover:bg-slate-50", !on);
  });
}
(function () {
  var KEY = "hr.employeeListQuery";
  var SAVED = ["view", "group", "department", "state", "type"]; // never "q": a search may be personal data
  function load() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(search) {
    try {
      var src = new URLSearchParams(search), out = new URLSearchParams();
      SAVED.forEach(function (k) { var v = src.get(k); if (v) { out.set(k, v); } });
      var text = out.toString();
      if (text) { localStorage.setItem(KEY, "?" + text); }
    } catch (e) { /* storage blocked: skip */ }
  }
  function clear() { try { localStorage.removeItem(KEY); } catch (e) { /* storage blocked: skip */ } }
  function syncView() {
    var form = document.querySelector("form[hx-get]");
    if (!form || !form.elements.view) { return; }
    hrSetView(form, new URLSearchParams(location.search).get("view") === "grid" ? "grid" : "table");
  }
  var nav = performance.getEntriesByType("navigation")[0];
  var type = nav && nav.type;
  var realLoad = type === "navigate" || type === "reload";
  var search = location.search;
  if (realLoad && !window.__hrListInit) {
    if (search === "?clear=1") {
      clear();
    } else if (search) {
      save(search);
    } else {
      var saved = load();
      if (saved && saved.charAt(0) === "?") { location.replace(saved); }
    }
  }
  if (!window.__hrListInit) {
    window.__hrListInit = true;
    document.addEventListener("htmx:pushedIntoHistory", function () { save(location.search); });
    document.addEventListener("htmx:historyRestore", function () { save(location.search); syncView(); });
  }
})();
</script>
{% endblock %}
