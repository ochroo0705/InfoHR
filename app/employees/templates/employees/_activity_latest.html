{% if latest_activity %}{% with e=latest_activity %}<button type="button" onclick="openDrawer()" title="Бүх өөрчлөлтийг харах" class="line-clamp-2 text-left hover:text-violet-700 hover:underline">Сүүлийн өөрчлөлт: {{ e.by.get_full_name|default:e.by.username|default:"Систем" }}, {% if e.at|date:"Y-m-d" == today|date:"Y-m-d" %}өнөөдөр {{ e.at|date:"H:i" }}{% else %}{{ e.at|date:"Y-m-d H:i" }}{% endif %} — {% with c=e.header_change %}{% if c %}{{ c.field }}: {% if c.old %}{{ c.old }} → {% endif %}{{ c.new|default:"(хоосон)" }}{% else %}{{ e.message|truncatechars:70 }}{% endif %}{% endwith %}</button>{% endwith %}{% endif %}
