{% if latest_activity %}{% with e=latest_activity %}<button type="button" onclick="openDrawer()" class="text-left hover:text-violet-700">Сүүлд: {% if e.changes %}{% with c=e.changes.0 %}{{ c.field }}: {% if c.old %}{{ c.old }} → {% endif %}{{ c.new|default:"(хоосон)" }}{% endwith %}{% else %}{{ e.message|truncatechars:60 }}{% endif %} · {{ e.by.get_full_name|default:e.by.username|default:"Систем" }} · {% if e.at|date:"Y-m-d" == today|date:"Y-m-d" %}{{ e.at|date:"H:i" }}{% else %}{{ e.at|date:"Y-m-d H:i" }}{% endif %}</button>{% endwith %}{% endif %}
