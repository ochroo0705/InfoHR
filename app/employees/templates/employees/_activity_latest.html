{% if latest_activity %}{% with e=latest_activity %}<button type="button" onclick="openDrawer()" title="Бүх өөрчлөлтийг харах" class="text-left hover:text-violet-700 hover:underline">Сүүлийн өөрчлөлт: {{ e.by.get_full_name|default:e.by.username|default:"Систем" }}, {% if e.at|date:"Y-m-d" == today|date:"Y-m-d" %}өнөөдөр {{ e.at|date:"H:i" }}{% else %}{{ e.at|date:"Y-m-d H:i" }}{% endif %} — {% if e.changes and not e.order_id %}{% with c=e.changes.0 %}{{ c.field }}: {% if c.old %}{{ c.old }} → {% endif %}{{ c.new|default:"(хоосон)" }}{% endwith %}{% else %}{{ e.message|truncatechars:70 }}{% endif %}</button>{% endwith %}{% endif %}
