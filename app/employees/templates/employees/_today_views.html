{% if tiles %}
<section class="card-soft mb-5 p-4" data-today-views aria-labelledby="views-title">
  <h2 id="views-title" class="sec-title mb-2">Удахгүй болох</h2>
  {% for tile in tiles %}
  {# The whole row is the link: the name's link covers the row (after:inset-0), so the caption and the count click too. #}
  <div class="relative -mx-2 flex items-baseline justify-between gap-3 rounded-lg border-b border-slate-100 px-2 py-1.5 text-sm transition-colors hover:bg-violet-50 focus-within:bg-violet-50 last:border-0">
    <div class="min-w-0">
      <a href="{{ tile.url }}" class="break-words text-violet-700 after:absolute after:inset-0 after:content-[''] focus-visible:outline-none">{{ tile.name }}</a>
      <span class="block text-xs text-slate-500">{{ tile.report }}</span>
    </div>
    <span class="shrink-0 tabular-nums {% if tile.count %}font-semibold text-slate-900{% else %}text-slate-400{% endif %}" data-tile-count>{{ tile.count }}</span>
  </div>
  {% endfor %}
</section>
{% endif %}
