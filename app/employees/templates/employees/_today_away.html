<h3 class="mb-1 text-xs font-medium text-slate-500" data-away-day>{{ day|date:"Y-m-d" }}</h3>
{% for a in away %}
<div class="relative -mx-2 flex items-baseline justify-between gap-3 rounded-lg border-b border-slate-100 px-2 py-1.5 text-sm transition-colors hover:bg-violet-50 focus-within:bg-violet-50 last:border-0">
  <a href="{% url 'employees:detail' a.row.employee.pk %}" class="text-violet-700 after:absolute after:inset-0 after:content-[''] focus-visible:outline-none">{{ a.row.employee.full_name }}</a>
  <span class="text-right text-slate-500">{{ a.label }} · {{ a.until|date:"Y-m-d" }} хүртэл</span>
</div>
{% empty %}<p class="text-sm text-slate-400">Энэ өдөр чөлөөтэй хүн алга.</p>{% endfor %}
