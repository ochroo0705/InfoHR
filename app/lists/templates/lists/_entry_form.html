<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" onclick="if(event.target===this)this.remove()">
  <div class="max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-xl bg-white p-6 shadow-xl">
    <h2 class="mb-4 text-lg font-semibold">{{ title }}</h2>
    <form hx-post="{{ action }}" hx-target="closest div.fixed" hx-swap="outerHTML" class="space-y-3">
      {% csrf_token %}
      {% if error %}<p class="rounded bg-red-50 p-2 text-sm text-red-700">{{ error }}</p>{% endif %}
      {% if form.non_field_errors %}<p class="rounded bg-red-50 p-2 text-sm text-red-700">{{ form.non_field_errors|join:" " }}</p>{% endif %}
      <div class="grid gap-3 md:grid-cols-2">{% for field in form %}
        <label class="block text-sm">{{ field.label }}{% if field.field.required %} *{% endif %}
          {{ field }}{% for e in field.errors %}<span class="text-xs text-red-600">{{ e }}</span>{% endfor %}</label>{% endfor %}
      </div>
      <div class="flex items-center gap-2 pt-2">
        {% if entry %}
        <button type="button" hx-post="{{ delete_url }}" hx-target="closest div.fixed" hx-swap="outerHTML"
                hx-confirm="Энэ бичлэгийг устгах уу?" class="mr-auto rounded px-2 py-1 text-red-600 hover:bg-red-50">Устгах</button>
        {% endif %}
        <button type="button" onclick="this.closest('div.fixed').remove()" class="rounded-lg border border-slate-300 px-4 py-2 text-sm">Болих</button>
        <button class="rounded-lg bg-violet-600 px-4 py-2 text-sm text-white hover:bg-violet-700">Хадгалах</button>
      </div>
    </form>
  </div>
</div>
