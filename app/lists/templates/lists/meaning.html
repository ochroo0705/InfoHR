{% extends "base.html" %}
{% block title %}Утгын холбоо{% endblock %}
{% block content %}
<div class="flex items-center gap-3">
  <a href="{% url 'lists:index' %}" class="text-sm text-violet-700 hover:underline">← Жагсаалтууд</a>
  <h1 class="mr-auto text-xl font-semibold">Утгын холбоо</h1>
</div>
<form method="post" class="mt-4 space-y-4 rounded-xl border border-slate-200 bg-white p-6">
  {% csrf_token %}
  {% for row in rows %}
  <label class="block text-sm">{{ row.spec.label }}
    <span class="block text-xs text-slate-500">{{ row.spec.hint }}</span>
    <select name="{{ row.key }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      <option value="">— сонгоогүй —</option>
      {% for option in row.options %}<option value="{{ option.pk }}" {% if option.pk == row.current %}selected{% endif %}>{{ option.name|default:option.pk }}</option>{% endfor %}
    </select>
  </label>
  {% endfor %}
  <div class="flex justify-end pt-2">
    <button class="rounded-lg bg-violet-600 px-4 py-2 text-sm text-white hover:bg-violet-700">Хадгалах</button>
  </div>
</form>
{% endblock %}
