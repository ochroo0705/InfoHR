{% extends "admin/base_site.html" %}
{% load admin_urls %}
{% block bodyclass %}{{ block.super }} {{ opts.app_label }}-{{ opts.model_name }} change-form{% endblock %}
{% block content %}
<div id="content-main">
  <form method="post">{% csrf_token %}
    {% include "unfold/helpers/messages/info.html" with message=intro %}
    <button type="submit" class="bg-primary-600 border border-transparent font-medium px-3 py-2 rounded-default text-sm text-white">Түр нууц үг үүсгэх</button>
    <a href="{% url opts|admin_urlname:'change' original.pk %}" class="ml-2 px-3 py-2 text-sm">Болих</a>
  </form>
</div>
{% endblock %}
