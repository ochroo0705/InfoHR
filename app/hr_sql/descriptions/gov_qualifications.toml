# Draft. English from the model labels in app/macs/models.py (QualificationRow and its code lists). Mongolian drafted
# from the same labels; check the wording. Signed only by the domain owner (reviewed_by and reviewed_on stay empty until
# then).

description = "One row per qualification or diploma of an employee you may see: the qualification type, the profession, the organisation, the diploma number, the period, the education level, the academic degree and the country. Use it to answer questions about an employee's professional qualifications and diplomas. Many rows can belong to one person."
description_mn = "Харах эрхтэй ажилтны мэргэшил, дипломын бүртгэл бүрийн нэг мөр: мэргэшлийн төрөл, мэргэжил, байгууллага, дипломын дугаар, хугацаа, боловсролын түвшин, эрдмийн зэрэг, улс. Нэг ажилтанд хэд хэдэн мөр байж болно."

rules = [
    # One row per qualification or diploma, not per person: one person can have many rows.
    # app/hr_sql/views.py (GOV_QUALIFICATIONS statement)
    "One row per qualification or diploma, so count people with COUNT(DISTINCT EMP_ID), not COUNT(*).",
    # DEGREE_NAME is the academic degree (for example a master's degree); EDUCATION_LEVEL_NAME is the level of education.
    # app/macs/models.py (QualificationRow.grade, QualificationRow.edu_level)
    "DEGREE_NAME is the academic degree of the diploma (for example a bachelor's or master's degree). EDUCATION_LEVEL_NAME is the level of education of the qualification. Do not treat the two as the same.",
    # The four name columns are empty when the record has no type, profession, level or degree that can be found.
    # app/hr_sql/views.py (GOV_QUALIFICATIONS statement, LEFT JOINs to the code lists)
    "QUALIFICATION_TYPE_NAME, PROFESSION_NAME, EDUCATION_LEVEL_NAME and DEGREE_NAME are empty when the record does not give that code, so a row can have empty names and still count.",
    # START_YEAR and END_YEAR are always filled; START_DATE and END_DATE can be empty.
    # app/macs/models.py (QualificationRow.start_year, QualificationRow.end_year)
    "START_YEAR and END_YEAR are always filled. START_DATE and END_DATE can be empty, so use the years when the dates are empty.",
    # No shared key with GOV_EDUCATION beyond EMP_ID: a join between the two views is only by employee.
    # app/macs/models.py (QualificationRow has no link to EducRow)
    "There is no shared key with GOV_EDUCATION except EMP_ID. Join to GOV_EMPLOYEES on EMP_ID.",
]
reviewed_by = ""
reviewed_on = ""

