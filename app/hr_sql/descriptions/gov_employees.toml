# needs native read
# Draft. English from the catalogue text that was inline in hr_sql/catalogue.py; Mongolian drafted from the model
# labels (macs/models.py Employee, Department, Branch, Position). Signed only by the domain owner.

description = "One row per employee you are allowed to see. Use it for counts and lists of staff."
description_mn = "Таны харах эрхтэй ажилтан бүрийн нэг мөр. Ажилтны тоо, жагсаалтад ашиглана."

rules = [
    # The WORKING column is decided in Python with the employee list's own rule (row_for and is_working): the job on
    # today, or the MACS employment code for a person with no HR job history.
    # app/employees/listing.py (row_for, is_working, WORKING_STATES)
    "The view lists everyone in your scope, including people who have left. For head counts of people who still work here, filter WORKING = 1; WORKING is 0 for people who have left.",
    # Old MACS employment codes 2, 3 and 4 mean not working (never worked, or dismissed).
    # app/employees/listing.py (LEGACY_NOT_WORKING, NEVER_WORKED)
    "Old MACS employment codes 2, 3 and 4 mean the person is not working. WORKING is 0 for them when the person has no HR job history; the rows are not filtered out.",
    # One row per employee: the joins to department, branch and position are single-valued.
    # app/hr_sql/views.py (GOV_EMPLOYEES statement)
    "One row per employee, so COUNT(*) counts people.",
    # Rows come only for employees whose id is in the asker's scope; an empty scope gives no rows.
    # app/hr_sql/views.py (module docstring, GOV_SCOPE filter)
    "Only employees whose id is in your scope appear; an empty scope gives no rows.",
]
reviewed_by = "Your Name"
reviewed_on = "2026-11-12"

