[[columns]]
name = "MONTHLY_PAYMENT"
description = "Monthly repayment amount (money, two decimals)"
description_mn = "Сарын төлбөрийн дүн (мөнгөн дүн, хоёр аравтын орон)"
label_mn = "Сарын төлбөр"
synonyms = ["monthly", "payment", "instalment"]

[[columns]]
name = "REASON"
description = "Reason for the loan (the loan basis name)"
description_mn = "Зээлийн үндэслэл"
label_mn = "Үндэслэл"
synonyms = ["purpose", "basis", "why"]
