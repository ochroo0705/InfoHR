# Draft. English from the model labels in app/macs/models.py (CertificateRow and SpecEduType). Mongolian drafted from the
# same labels; check the wording. Signed only by the domain owner (reviewed_by and reviewed_on stay empty until then).

description = "One row per special education or certificate record of an employee you may see: the certificate type, the organisation, the certificate number and date, the end date, the profession, the special profession and the year. Use it to answer questions about an employee's certificates and special education. Many rows can belong to one person."
description_mn = "Харах эрхтэй ажилтны тусгай боловсрол, сертификатын бүртгэл бүрийн нэг мөр: сертификатын төрөл, байгууллага, гэрчилгээний дугаар ба огноо, дуусах огноо, мэргэжил, тусгай мэргэжил, он. Нэг ажилтанд хэд хэдэн мөр байж болно."

rules = [
    # One row per certificate or special education record, not per person: one person can have many rows.
    # app/hr_sql/views.py (GOV_CERTIFICATES statement)
    "One row per certificate or special education record, so count people with COUNT(DISTINCT EMP_ID), not COUNT(*).",
    # CERTIFICATE_TYPE_NAME is empty when the record has no type that can be found.
    # app/hr_sql/views.py (GOV_CERTIFICATES statement, LEFT JOIN to the special education type)
    "CERTIFICATE_TYPE_NAME is the name of the special education type. It is empty when the type is not recorded.",
    # ORGANISATION is the name of the organisation that issued the certificate; CERTIFICATE_NUMBER and CERTIFICATE_DATE can be empty.
    # app/macs/models.py (CertificateRow.org_edu, CertificateRow.certify_number, CertificateRow.certify_date)
    "ORGANISATION is the organisation that issued the certificate. CERTIFICATE_NUMBER and CERTIFICATE_DATE can be empty when they are not recorded.",
    # END_DATE, PROFESSION and SPECIAL_PROFESSION are optional; CERTIFICATE_YEAR is always filled.
    # app/macs/models.py (CertificateRow.end_date, CertificateRow.profession, CertificateRow.spec_profession, CertificateRow.certify_year)
    "END_DATE, PROFESSION and SPECIAL_PROFESSION can be empty. CERTIFICATE_YEAR is always filled, so use it when CERTIFICATE_DATE is empty.",
    "Join to GOV_EMPLOYEES on EMP_ID.",
]
reviewed_by = ""
reviewed_on = ""

