[[columns]]
name = "HEADCOUNT"
description = "Number of people in this ONE department record you may see who still work here; a name shared by two records is split over two rows, so do not use it for the size of a department by name (count GOV_EMPLOYEES instead)"
description_mn = "Тухайн хэлтэст харах эрхтэй, одоо ажиллаж буй хүний тоо; жинхэнэ хэмжээнээс бага байж болно (дүрмийг үз)"
label_mn = "Ажилтны тоо"
synonyms = ["headcount", "staff count", "number of staff", "size", "how many"]
