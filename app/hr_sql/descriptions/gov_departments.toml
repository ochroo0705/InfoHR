name = "DEPARTMENT_ID"
description = "Department number (internal id)"
description_mn = "Хэлтсийн дугаар (дотоод)"
label_mn = "Хэлтсийн дугаар"
synonyms = ["id", "department number", "dep id"]

[[columns]]
name = "DEPARTMENT_NAME"
description = "Name of the department"
description_mn = "Хэлтсийн нэр"
label_mn = "Хэлтэс"
synonyms = ["department", "unit", "dept", "name"]

[[columns]]
name = "HEADCOUNT"
description = "Number of people in this department you may see who still work here; can be lower than the true size (see the rules)"
description_mn = "Тухайн хэлтэст харах эрхтэй, одоо ажиллаж буй хүний тоо; жинхэнэ хэмжээнээс бага байж болно (дүрмийг үз)"
label_mn = "Ажилтны тоо"
synonyms = ["headcount", "staff count", "number of staff", "size", "how many"]
