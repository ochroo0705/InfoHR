description_mn = "Албан тушаалын дугаар (дотоод)"
label_mn = "Албан тушаалын дугаар"
synonyms = ["id", "position number", "pos id", "occupation id"]

[[columns]]
name = "POSITION_NAME"
description = "Name of the position"
description_mn = "Албан тушаалын нэр"
label_mn = "Албан тушаал"
synonyms = ["position", "job title", "title", "post", "name"]

[[columns]]
name = "HEADCOUNT"
description = "Number of people in this position you may see who still work here; can be lower than the true number (see the rules)"
description_mn = "Тухайн албан тушаалд харах эрхтэй, одоо ажиллаж буй хүний тоо; жинхэнэ тооноос бага байж болно (дүрмийг үз)"
label_mn = "Ажилтны тоо"
synonyms = ["headcount", "staff count", "number of staff", "how many", "size"]
