{% for row in rows %}
<tr{% if selectable and row.0.person %} data-person="{{ row.0.person }}"{% endif %}>
  {% if selectable %}<td class="{{ check_css }}"{% if check_style %} style="{{ check_style }}"{% endif %}><input type="checkbox" data-select-row autocomplete="off" aria-label="Мөр сонгох"></td>{% endif %}
  {% for cell in row %}
  <td{% if cell.css %} class="{{ cell.css }}"{% endif %}{% if cell.sticky_left %} style="{{ cell.sticky_left }}"{% endif %}{% if can_edit_rows and cell.row_kind and cell.row_key and cell.row_field %} data-edit="{% url 'reports:row_cell' %}?person={{ cell.edit_person }}&amp;kind={{ cell.row_kind }}&amp;key={{ cell.row_key }}&amp;field={{ cell.row_field }}" data-row-edit{% elif can_correct_cells and cell.correct and cell.record or can_correct_salary and cell.correct == "salary" and cell.value is not None %} data-correct data-edit="{% url 'reports:correct' %}?person={{ cell.edit_person }}&amp;key={{ cell.correct }}{% if cell.record %}&amp;record={{ cell.record }}{% endif %}"{% elif can_edit_cells and cell.edit %}{% if cell.edit in salary_fields %}{% if salary_cells %} data-edit="{% url 'reports:cell_edit' %}?person={{ cell.edit_person }}&amp;field={{ cell.edit }}"{% endif %}{% elif plain_cells %} data-edit="{% url 'reports:cell_edit' %}?person={{ cell.edit_person }}&amp;field={{ cell.edit }}"{% endif %}{% endif %}>{% if cell.href %}<a href="{{ cell.href }}" class="text-violet-700 hover:underline">{% endif %}{% include "reports/_cell.html" %}{% if cell.href %}</a>{% endif %}</td>
  {% endfor %}
</tr>
{% endfor %}
