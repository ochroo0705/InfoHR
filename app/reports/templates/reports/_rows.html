{% for row in rows %}
<tr{% if selectable and row.0.person %} data-person="{{ row.0.person }}"{% endif %}>
  {% if selectable %}<td class="w-10"><input type="checkbox" data-select-row autocomplete="off" aria-label="Мөр сонгох"></td>{% endif %}
  {% for cell in row %}
  <td{% if cell.css %} class="{{ cell.css }}"{% endif %}{% if cell.sticky_left %} style="{{ cell.sticky_left }}"{% endif %}>{% if cell.href %}<a href="{{ cell.href }}" class="text-violet-700 hover:underline">{% endif %}{% include "reports/_cell.html" %}{% if cell.href %}</a>{% endif %}</td>
  {% endfor %}
</tr>
{% endfor %}
