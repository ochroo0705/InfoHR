{% for row in rows %}
<tr>
  {% for cell in row %}
  <td{% if cell.cls %} class="{{ cell.cls }}"{% endif %}>{% if cell.href %}<a href="{{ cell.href }}" class="text-violet-700 hover:underline">{% endif %}{% include "reports/_cell.html" %}{% if cell.href %}</a>{% endif %}</td>
  {% endfor %}
</tr>
{% endfor %}
