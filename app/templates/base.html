{% load static %}<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Info HR{% endblock %} · Info HR</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/datepicker.js' %}" defer></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% if user.is_authenticated %}
  <header class="bg-white border-b border-slate-200">
    <nav class="mx-auto max-w-6xl flex items-center gap-6 px-4 h-14">
      <a href="{% url 'home' %}" class="font-semibold text-violet-700">Info HR</a>
      <a href="{% url 'employees:list' %}" class="text-sm hover:text-violet-700">Ажилтнууд</a>
      <span class="ml-auto text-sm text-slate-500">{{ user.get_full_name|default:user.username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}
        <button class="text-sm text-slate-500 hover:text-red-600">Гарах</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <div id="page"><main class="mx-auto max-w-6xl px-4 py-6">{% block content %}{% endblock %}</main></div>
  <div id="modal"></div>
</body>
</html>
