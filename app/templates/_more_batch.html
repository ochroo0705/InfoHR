{# The «Цааш харуулах» pill of a list that loads in batches (config/batching.py). Pass url, next_query and kind ("div" | "tr" with colspan). #}
{% if kind == "tr" %}<tr data-more-row><td colspan="{{ colspan }}" class="px-4 py-3 text-center">{% else %}<div class="col-span-full flex justify-center py-4">{% endif %}<button type="button" data-more-batch hx-get="{{ url }}?{{ next_query }}" hx-trigger="revealed, click" hx-target="closest {{ kind }}" hx-swap="outerHTML" hx-indicator="find .htmx-indicator" class="inline-flex items-center gap-2 rounded-full border border-slate-300 bg-surface px-4 py-1.5 text-sm text-slate-600 hover:border-violet-300 hover:text-violet-700"><svg aria-hidden="true" class="htmx-indicator h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 3a9 9 0 1 0 9 9" stroke-linecap="round"/></svg>Цааш харуулах</button>{% if kind == "tr" %}</td></tr>{% else %}</div>{% endif %}
