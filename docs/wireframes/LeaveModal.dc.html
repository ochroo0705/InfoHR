<x-dc>

<div style="width: 1280px; height: 800px; background: #8a8a85; font-family: 'IBM Plex Sans', sans-serif; color: #1c1c1a; font-size: 14px; display: flex; align-items: center; justify-content: center">

<h2 id="lvtitle" style="margin: 0; font-size: 18px; font-weight: 600">Чөлөө бүртгэх — Ажилтан 4</h2>
<a href="Employee.dc.html" aria-label="Хаах" style="margin-left: auto; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #1c1c1a; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15" stroke="currentColor" stroke-width="2" fill="none"/></svg></a>

<div style="padding: 20px; display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #55554f">Чөлөөний төрөл</span>
<select style="min-height: 44px; padding: 0 10px; border: 1px solid #b8b8b2; border-radius: 6px; font: inherit; background: #ffffff"><option>Ээлжийн амралт</option><option>Өвчний чөлөө</option><option>Цалингүй чөлөө</option><option>Цалинтай чөлөө</option></select>
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #55554f">Эхлэх</span><input type="date" value="2026-11-09" style="min-height: 44px; padding: 0 10px; border: 1px solid #b8b8b2; border-radius: 6px; font: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #55554f">Дуусах</span><input type="date" value="2026-11-13" style="min-height: 44px; padding: 0 10px; border: 1px solid #b8b8b2; border-radius: 6px; font: inherit"></label>
</div>
<label style="display: flex; align-items: center; gap: 8px; min-height: 44px"><input type="checkbox" style="width: 18px; height: 18px"><span>Хагас өдөр</span></label>
<div style="background: #f4f4f2; border-radius: 6px; padding: 12px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 13px">
<div><span style="color: #55554f">Ажлын өдөр</span><br><strong style="font-size: 16px">5</strong></div>
<div><span style="color: #55554f">Одоогийн үлдэгдэл</span><br><strong style="font-size: 16px">7.5</strong></div>
<div><span style="color: #55554f">Дараа нь</span><br><strong style="font-size: 16px">2.5</strong></div>
</div>
<p style="margin: 0; font-size: 13px; color: #8a4a0b; background: #fdecd8; padding: 8px 12px; border-radius: 6px">Анхааруулга: энэ жил 10 хоногоос дээш үргэлжилсэн амралт аваагүй байна.</p>
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #55554f">Тайлбар</span>
<textarea rows="3" style="padding: 10px; border: 1px solid #b8b8b2; border-radius: 6px; font: inherit; resize: vertical"></textarea>

<div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 16px 20px; border-top: 1px solid #dcdcd6">
<a href="Employee.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #b8b8b2; border-radius: 6px; color: #1c1c1a; text-decoration: none">Болих</a>
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #1d4ed8; color: #1d4ed8; background: #ffffff; border-radius: 6px; font: inherit">Илгээх</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border: 0; background: #1d4ed8; color: #ffffff; border-radius: 6px; font: inherit; font-weight: 600">Илгээх ба батлах</button>
